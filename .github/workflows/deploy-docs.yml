name: Deploy Docs to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm build` builds the workspace packages first (the docs import them
      # through their dist entries, in topological order) and then the docs into
      # docs/dist.
      - name: Build
        run: pnpm build

      # Direct upload: the prebuilt docs/dist is pushed to the Pages project.
      # Requires the repo secrets CLOUDFLARE_API_TOKEN (Account → Cloudflare
      # Pages → Edit) and CLOUDFLARE_ACCOUNT_ID. The `nprogress-next-docs`
      # project (and its custom domain nprogress-next.nachodiaz.es) is managed in
      # the Cloudflare dashboard.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/dist --project-name=nprogress-next-docs
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
