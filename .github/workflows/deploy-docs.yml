name: Deploy Docs to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm build` builds the workspace packages first (the docs import them
      # through their dist entries, in topological order) and then the docs into
      # docs/dist.
      - name: Build
        run: pnpm build

      # Direct upload of the prebuilt docs/dist.
      #
      # `pnpm dlx` instead of cloudflare/wrangler-action: the action tries to
      # install wrangler with a bare `pnpm add`, which a pnpm workspace root
      # rejects with ERR_PNPM_ADDING_TO_ROOT. dlx fetches wrangler in an isolated
      # store and works in a workspace. Requires the repo secrets
      # CLOUDFLARE_API_TOKEN (Account → Cloudflare Pages → Edit) and
      # CLOUDFLARE_ACCOUNT_ID. The `nprogress-next-docs` project and its custom
      # domain are managed in the Cloudflare dashboard.
      - name: Deploy to Cloudflare Pages
        run: pnpm dlx wrangler@4 pages deploy docs/dist --project-name=nprogress-next-docs --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
