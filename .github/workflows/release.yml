name: Release to npm

# Manual, opt-in publishing. Nothing here runs on push, so a green CI run can
# never publish by accident — you trigger it from the Actions tab (or `gh
# workflow run release.yml`) once you decide to ship.
#
# `dry_run` defaults to true, so the first runs only package and validate the
# tarballs. Uncheck it (or `-f dry_run=false`) to publish for real.
#
# Requires the repo secret `NPM_TOKEN`. It must be able to CREATE new packages
# and to bypass 2FA (npm requires 2FA for publishing since 2026); a token
# without those gets a 403 "You may not perform that action with these
# credentials." on the first publish. Two valid options:
#   - Classic token of type "Automation" (simplest), or
#   - Granular token with "Bypass two-factor authentication" checked,
#     Permissions = "Read and write (publish and stage)" (NOT stage only) and
#     Select Packages = "All Packages" (specific packages cannot be created).
# The token is injected by actions/setup-node below (registry-url +
# NODE_AUTH_TOKEN), written to a user-level .npmrc outside the repo — pnpm 12
# ignores ${ENV} placeholders in the repository's own .npmrc.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (do not publish to npm)"
        type: boolean
        default: true
      ref:
        description: "Git ref to release (branch, tag or SHA). Defaults to the current default branch."
        type: string
        default: main

permissions:
  contents: write # publish creates/pushes tags; createGithubReleases needs it
  pull-requests: write # changesets/action may open the version PR

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Configure pnpm
        run: pnpm config set verify-store-integrity false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same gates as CI: never publish something that would fail CI.
      - name: Build all packages
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Size gate
        run: pnpm size

      - name: Pack (dry-run)
        run: pnpm -r pack --dry-run

      # pnpm 12 attempts Trusted Publishing (OIDC) by default, so it prints a
      # benign "Skipped OIDC: ... INCORRECT_PERMISSIONS" warning unless the
      # workflow grants `id-token: write`. This workflow deliberately uses a
      # token instead; auth comes from actions/setup-node above (registry-url +
      # NODE_AUTH_TOKEN). Once the packages exist on npm, switching each to a
      # Trusted Publisher removes the warning and the need for the secret.
      - name: Publish (dry run)
        if: ${{ inputs.dry_run }}
        run: pnpm -r --filter "./packages/*" publish --dry-run --no-git-checks
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Real publish, via changesets/action:
      #  - runs `changeset publish`: rewrites `workspace:*` to concrete versions,
      #    publishes in dependency order (core before react/vue) and creates the
      #    git tags;
      #  - with `createGithubReleases`, opens a GitHub Release per published
      #    package using its changelog.
      # With no pending changesets (the version PR is already merged) it goes
      # straight to publishing; if changesets were pending it would open a
      # version PR instead, which is harmless.
      - name: Publish & create GitHub Releases
        if: ${{ !inputs.dry_run }}
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          createGithubReleases: true
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
