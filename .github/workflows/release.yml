name: Release to npm

# Manual, opt-in publishing. Nothing here runs on push, so a green CI run can
# never publish by accident — you trigger it from the Actions tab (or `gh
# workflow run release.yml`) once you decide to ship.
#
# `dry_run` defaults to true, so the first runs only package and validate the
# tarballs. Uncheck it (or `-f dry_run=false`) to publish for real.
#
# Requires the repo secret `NPM_TOKEN` (an npm "Automation" token). It is
# injected by actions/setup-node below (registry-url + NODE_AUTH_TOKEN), written
# to a user-level .npmrc outside the repo — pnpm 12 ignores ${ENV} placeholders
# in the repository's own .npmrc.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (do not publish to npm)"
        type: boolean
        default: true
      ref:
        description: "Git ref to release (branch, tag or SHA). Defaults to the current default branch."
        type: string
        default: main

permissions:
  contents: write # changeset publish creates and pushes version tags

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Configure pnpm
        run: pnpm config set verify-store-integrity false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same gates as CI: never publish something that would fail CI.
      - name: Build all packages
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Size gate
        run: pnpm size

      - name: Pack (dry-run)
        run: pnpm -r pack --dry-run

      - name: Publish (dry run)
        if: ${{ inputs.dry_run }}
        run: pnpm -r --filter "./packages/*" publish --dry-run --no-git-checks
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Real publish: `changeset publish` rewrites `workspace:*` to the concrete
      # version, publishes in dependency order (core before react/vue) and
      # creates the git tags.
      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: pnpm changeset publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
